name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Tier 0/1: the dependency-free runtime must work on a clean machine.
  # ---------------------------------------------------------------------------
  runtime:
    name: runtime (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: No third-party packages installed
        run: python -c "import sys; print(sys.version)"

      - name: Doctor
        run: python install.py --check

      - name: Offline demo
        run: python run_demo.py

      - name: Deterministic scenarios
        run: python scenario_runner.py

      - name: Test suite
        run: python -m unittest discover -s tests -v

  # ---------------------------------------------------------------------------
  # Go runtime: a standalone executable that needs no Python installed.
  # ---------------------------------------------------------------------------
  go-runtime:
    name: go runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: runtime-go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Formatting
        working-directory: runtime-go
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: runtime-go
        run: go vet ./...

      - name: Tests
        working-directory: runtime-go
        run: go test ./...

      - name: Go scenario suite
        working-directory: runtime-go
        run: go run ./cmd/rdr2-npc --scenarios ../scenarios

      - name: Parity against the Python runtime
        run: python scripts/compare_runtimes.py

      - name: Build the standalone Windows runtime
        if: runner.os == 'Windows'
        working-directory: runtime-go
        run: go build -trimpath -ldflags "-s -w" -o rdr2-npc.exe ./cmd/rdr2-npc

      - name: Smoke test the executable
        if: runner.os == 'Windows'
        working-directory: runtime-go
        shell: pwsh
        run: |
          .\rdr2-npc.exe --version
          .\rdr2-npc.exe --check

      # One download for users: the executable plus the config/data it reads.
      - name: Package the portable Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dist/rdr2-npc"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item runtime-go/rdr2-npc.exe $stage/
          Copy-Item -Recurse -Path config -Destination "$stage/"
          Copy-Item -Recurse -Path data -Destination "$stage/"
          Copy-Item -Recurse -Path scenarios -Destination "$stage/"
          New-Item -ItemType Directory -Force -Path "$stage/data/timelines" | Out-Null
          Remove-Item "$stage/data/timelines/*" -Force -ErrorAction SilentlyContinue
          Copy-Item .env.example "$stage/.env.example"
          Copy-Item docs/INSTALL.md "$stage/INSTALL.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/rdr2-npc-portable-win64.zip"

      - name: Verify the bundle runs standalone
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $probe = "dist/probe"
          Expand-Archive -Path "dist/rdr2-npc-portable-win64.zip" -DestinationPath $probe
          Push-Location $probe
          .\rdr2-npc.exe --version
          .\rdr2-npc.exe --check
          .\rdr2-npc.exe --scenarios .\scenarios
          Pop-Location

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rdr2-npc-runtime-exe
          path: |
            runtime-go/rdr2-npc.exe
            dist/rdr2-npc-portable-win64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tier 2: publish the in-game plugin so users need no compiler.
  # ---------------------------------------------------------------------------
  asi:
    name: native bridge (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the official ScriptHookRDR2 SDK
        run: python scripts/install_scripthook_sdk.py

      - name: Configure
        run: cmake -S bridge -B bridge/build -A x64 -DRDR2AI_HAS_SCRIPTHOOK=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build bridge/build --config Release

      - name: Verify the .asi exists
        shell: pwsh
        run: |
          $asi = Get-ChildItem -Path bridge/build -Filter rdr2_ai_bridge.asi -Recurse
          if (-not $asi) { throw "rdr2_ai_bridge.asi was not produced" }
          Write-Host "built: $($asi.FullName)"

      - name: Portable core test
        run: |
          cmake -S bridge -B bridge/build-core -A x64
          cmake --build bridge/build-core --config Release
          ctest --test-dir bridge/build-core -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: rdr2_ai_bridge-asi
          path: bridge/build/**/rdr2_ai_bridge.asi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Attach the plugin to a GitHub release when a version tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: attach artifacts to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [asi, go-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rdr2_ai_bridge-asi
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: rdr2-npc-runtime-exe
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/rdr2_ai_bridge.asi
            artifacts/**/rdr2-npc.exe
            artifacts/**/rdr2-npc-portable-win64.zip
          body: |
            Three downloads, pick what you need:

            | File | What it is |
            |---|---|
            | `rdr2-npc-portable-win64.zip` | **Easiest.** Runtime + config + data. Extract and run — no Python, no Go. |
            | `rdr2-npc.exe` | Just the standalone runtime, for an existing checkout. |
            | `rdr2_ai_bridge.asi` | In-game plugin. Copy next to `RDR2.exe`, together with `ScriptHookRDR2.dll` from http://www.dev-c.com/rdr2/scripthookrdr2/ |

            Standalone runtime (no Python required):

            ```powershell
            Expand-Archive rdr2-npc-portable-win64.zip -DestinationPath rdr2-npc
            cd rdr2-npc
            .\rdr2-npc.exe --check
            .\rdr2-npc.exe --backend adk
            ```

            Python runtime (still supported, also dependency-free):

            ```bash
            python3 install.py --check
            python3 -m runtime.main --backend llm
            ```

            Both runtimes speak the same IPC protocol and read the same files, so
            the `.asi` works with either. See `docs/INSTALL.md` for the full guide.
